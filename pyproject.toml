[tool.poetry]
name = "inverse-design"
version = "0.1.0"
description = ""
authors = ["pohaoc2 <pohaoc2@uw.edu>"]
readme = "README.md"
packages = [{ include = "inverse_design", from = "src" }]
include = [{ path = "src/inverse_design/sample_inputs/*.xml", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
matplotlib = "^3.10.0"
hydra-core = "^1.3.2"
scipy = "^1.15.1"
pandas = "^2.2.3"
pylint = "^3.3.3"
salib = "^1.5.1"
openpyxl = "^3.1.5"
tqdm = "^4.67.1"
scikit-learn = "^1.6.1"
seaborn = "^0.13.2"
graphviz = "^0.20.3"
plotly = "^6.0.1"
boto3 = "^1.34.0"
s3fs = "^2024.6.0"
fsspec = "^2024.6.0"
networkx = "<3.5"
PyYAML = "^6.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = "^6.0.0"
ruff = "^0.11.11"
pip-audit = "^2.8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=inverse_design --cov-report=xml --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Match the pragmatic lint posture used by Pylint for this research codebase.
ignore = [
  "E722",
  "E741",
  "F401",
  "F541",
  "F811",
  "F841",
]

[tool.pylint.main]
source-roots = ["src"]
py-version = "3.10"

# Pragmatic defaults for a scientific codebase; tighten over time.
[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-instance-attributes",
  "too-many-lines",
  "duplicate-code",
  "fixme",
  "broad-exception-caught",
  "broad-exception-raised",
  "import-outside-toplevel",
  "wrong-import-position",
  "line-too-long",
  "unspecified-encoding",
  "invalid-name",
  "protected-access",
  "attribute-defined-outside-init",
  "consider-using-with",
  "bare-except",
  "trailing-whitespace",
  "missing-final-newline",
  "trailing-newlines",
  "wrong-import-order",
  "ungrouped-imports",
  "unused-import",
  "redefined-outer-name",
  "unused-variable",
  "unused-argument",
  "reimported",
  "no-else-return",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-function-args",
  "import-error",
  "no-member",
  "no-name-in-module",
  "pointless-string-statement",
  "consider-using-enumerate",
  "consider-using-generator",
  "logging-fstring-interpolation",
  "f-string-without-interpolation",
  "unnecessary-lambda",
  "unnecessary-comprehension",
  "consider-iterating-dictionary",
  "cell-var-from-loop",
  "unbalanced-tuple-unpacking",
  "possibly-used-before-assignment",
  "inconsistent-return-statements",
  "dangerous-default-value",
  "consider-using-f-string",
  "use-dict-literal",
  "unnecessary-dict-index-lookup",
  "disallowed-name",
  "using-constant-test",
  "no-else-continue",
  "redefined-builtin",
  "nested-min-max",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
